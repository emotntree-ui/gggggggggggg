<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FFGlory</title>
    <meta http-equiv="refresh" content="0; url=/signup">
    <style>
        html, body {
            margin: 0; padding: 0;
            background: #050508; color: #F5E6D3;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center;
        }
        .box { padding: 40px 24px; }
        .spinner {
            width: 40px; height: 40px; margin: 0 auto 20px;
            border: 3px solid rgba(245, 230, 211, 0.15);
            border-top-color: #F5E6D3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #F5E6D3; text-decoration: underline; }
    </style>
    <script>
        window.location.replace('/signup');
    </script>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h2 style="margin: 0 0 12px; font-size: 20px;">Redirecting to Signup…</h2>
        <p style="margin: 0; color: #a0a0b0; font-size: 14px;">
            If not redirected, <a href="/signup">click here</a>.
        </p>
    </div>
</body>
</html>
